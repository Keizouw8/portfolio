<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Keizou Wang</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
	<style>
		:root{
			--red: rgb(200, 60, 60);
			--gray: rgb(30, 30, 30);
			--unit: min(0.7vw, 1vh);
		}

		@font-face {
			font-family: lazydog;
			src: url(/fonts/lazydog.otf);
		}

		@font-face {
			font-family: gabarito;
			src: url(/fonts/gabarito.ttf);
		}

		html{
			cursor: none !important;
		}

		body{
			background: var(--gray);
			color: white;
			-ms-overflow-style: none;
			scrollbar-width: none;
			overflow: hidden;
		}

		*{
			margin: 0;
			padding: 0;
		}

		::-webkit-scrollbar {
			display: none;
		}

		::selection{
			background: var(--red);
			color: white;
		}

		.fullpage{
			top: 0;
			left: 0;
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		@supports (height: 100dvh){
			.fullpage{
				height: 100dvh;
			}
		}

		.centered{
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
	</style>
</html>
