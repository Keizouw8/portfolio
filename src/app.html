<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Keizou Wang</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte-container">%sveltekit.body%</div>
	</body>
	<style>
		:root{
			--red: rgb(200, 60, 60);
			--gray: rgb(30, 30, 30);
			--unit: min(0.7vw, 1vh);
		}

		@font-face {
			font-family: lazydog;
			src: url(/fonts/lazydog.otf);
		}

		@font-face {
			font-family: gabarito;
			src: url(/fonts/gabarito.ttf);
		}

		html{
			cursor: none !important;
		}
		
		body: {
			background: var(--gray);
		}
		
		#svelte-container{
			scroll-snap-type: y mandatory;
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			overflow: scroll;
			overflow-x: hidden;
			overflow-y: scroll;
			-ms-overflow-style: none;
			scrollbar-width: none;
			color: white;
			scroll-behavior: smooth;
			background: var(--gray);
		}

		*{
			margin: 0;
			padding: 0;
		}

		::-webkit-scrollbar {
			display: none;
		}

		::selection{
			background: var(--red);
			color: white;
		}

		.fullpage{
			top: 0;
			left: 0;
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			scroll-snap-align: start;
			z-index: 2;
		}

		@supports (height: 100dvh){
			#svelte-container, .fullpage{
				height: 100dvh;
			}
		}

		.centered{
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
	</style>
</html>
